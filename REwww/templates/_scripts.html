<script>
/* Vanilla table sorter — works on any table.sortable, including dynamically
   injected content, via event delegation on document.               */
(function () {
  function cellText(tr, col) {
    const td = tr.cells[col];
    return td ? td.textContent.trim() : '';
  }
  function sortTable(th) {
    const table = th.closest('table');
    const tbody = table.querySelector('tbody');
    if (!tbody) return;
    const col     = th.cellIndex;
    const wasAsc  = th.classList.contains('sort-asc');
    const asc     = !wasAsc;
    table.querySelectorAll('thead th').forEach(h => h.classList.remove('sort-asc','sort-desc'));
    th.classList.add(asc ? 'sort-asc' : 'sort-desc');
    const rows = Array.from(tbody.querySelectorAll('tr'));
    rows.sort((a, b) => {
      const av = cellText(a, col), bv = cellText(b, col);
      const an = parseFloat(av), bn = parseFloat(bv);
      if (!isNaN(an) && !isNaN(bn)) return asc ? an - bn : bn - an;
      return asc ? av.localeCompare(bv) : bv.localeCompare(av);
    });
    rows.forEach(r => tbody.appendChild(r));
  }
  document.addEventListener('click', function (e) {
    const th = e.target.closest('table.sortable thead th');
    if (th) sortTable(th);
  });
})();
</script>

<script>
/* ══════════════════════════════════════════════════════════════════════════
   State
   ══════════════════════════════════════════════════════════════════════════ */
let currentRunId   = null;
let currentRunName = null;
let currentProject = null;
let pollTimer      = null;
let logLinesShown  = 0;
let runFromResearch  = false;  // true when Run Again was clicked from Research
let interactiveLoadedForRunId    = null;  // tracks which run the Interactive input table was built for
let _interactivePaneReadyPromise = null;  // pending Promise while the input table is being fetched

/* ── About panel toggle ── */
function showAbout() {
  const showing = document.getElementById('about-panel').style.display !== 'none';
  document.getElementById('about-panel').style.display  = showing ? 'none'  : 'block';
  document.getElementById('main-content').style.display = showing ? 'block' : 'none';
  document.getElementById('nav-about-btn').textContent  = showing ? 'About' : '← Back';
}

/* Current display modes */
const modes = { sets: 'tabular', lexicons: 'paragraph' };

/* ══════════════════════════════════════════════════════════════════════════
   Utility helpers
   ══════════════════════════════════════════════════════════════════════════ */
function setTabEnabled(tabNavId, enabled) {
  const link = document.getElementById(tabNavId);
  if (!link) return;
  if (enabled) link.classList.remove('disabled');
  else         link.classList.add('disabled');
}

/* Show or hide the non-Projects result tabs and the Batch Upstream button.
   Called with false on page load (Projects, no run) and whenever the user
   returns to Projects with no run loaded; called with true as soon as any
   run is loaded or any other tab is activated. */
function setRunTabsVisible(visible) {
  ['tab-research-nav','tab-interactive-nav','tab-parameters-nav','tab-sets-nav',
   'tab-stats-nav','tab-lexicons-nav'].forEach(navId => {
    const li = document.getElementById(navId);
    if (li) li.closest('li').style.display = visible ? '' : 'none';
  });
  const ctrl = document.getElementById('nav-batch-upstream');
  if (ctrl) ctrl.style.display = visible ? '' : 'none';
}
/* Initial state: Projects tab active, no run loaded → hide result tabs */
setRunTabsVisible(false);

/* Custom tab switcher — avoids Bootstrap tab plugin quirks with
   dynamically-enabled tabs.  All nav links carry data-re-tab (not
   data-toggle="tab") so Bootstrap never intercepts them. */
function activateTab(targetId) {
  document.querySelectorAll('#main-tabs .nav-link').forEach(link => {
    const href = link.getAttribute('href');
    if (href === '#' + targetId) link.classList.add('active');
    else                         link.classList.remove('active');
  });
  document.querySelectorAll('#main-tab-content .tab-pane').forEach(pane => {
    if (pane.id === targetId) pane.classList.add('show', 'active');
    else                      pane.classList.remove('show', 'active');
  });
}

function spinnerHtml() {
  return '<span class="spinner-border spinner-border-sm spinner-sm mr-1"></span>';
}

function basename(path) {
  return path ? String(path).split(/[/\\]/).pop() : '';
}

function loadTabContent(tab, mode) {
  if (!currentRunId) return;
  const url = `/api/tab/${currentRunId}/${tab}?mode=${mode || 'paragraph'}`;
  const viewEl = document.getElementById(`${tab}-view-content`)
              || document.getElementById(`${tab}-content`);
  if (!viewEl) return;
  viewEl.innerHTML = `<p class="text-muted">${spinnerHtml()}Loading…</p>`;
  fetch(url)
    .then(r => r.text())
    .then(html => {
      viewEl.innerHTML = html;
      if (tab === 'sets') postProcessSets(viewEl);
    })
    .catch(e  => { viewEl.innerHTML = `<p class="text-danger">Error: ${e}</p>`; });
}

/* Load one Research sub-pane: apiTab is the /api/tab/ endpoint name,
   targetId is the explicit content-div ID to populate.
   After loading, postProcessResearch strips the XSLT-generated section
   header (now shown in the panel's own header bar) and wires jump links. */
function loadResearchContent(apiTab, targetId, mode) {
  if (!currentRunId) return;
  const el = document.getElementById(targetId);
  if (!el) return;
  el.innerHTML = `<p class="text-muted">${spinnerHtml()}Loading…</p>`;
  fetch(`/api/tab/${currentRunId}/${apiTab}?mode=${mode || 'paragraph'}`)
    .then(r => r.text())
    .then(html => {
      el.innerHTML = html;
      postProcessResearch(apiTab);
    })
    .catch(e  => { el.innerHTML = `<p class="text-danger">Error: ${e}</p>`; });
}

function loadResearchPane() {
  if (!currentRunId) return;
  /* Reset Sets panel header buttons before new content arrives */
  ['research-link-sets-top','research-link-isolates','research-link-failures']
    .forEach(id => {
      const el = document.getElementById(id);
      if (el) { el.style.display = 'none'; el.textContent = ''; }
    });
  loadResearchContent('parameters', 'research-parameters-view-content');
  loadResearchContent('stats',      'research-stats-content');
  loadResearchContent('sets',       'research-sets-content', modes.sets || 'tabular');
}

/* ══════════════════════════════════════════════════════════════════════════
   rcn → ToC cross-linking
   toc2html-view.xsl stamps id="toc-corr-{num}" on each ToC body row.
   sets2tabular.xsl / sets2html.xsl / sets-isolates-failures.xsl emit
   <a class="rcn-link" data-corr-id="…"> for every rcn token.
   The handlers below scroll to the matching row and flash it.
   ══════════════════════════════════════════════════════════════════════════ */

/* Currently highlighted ToC row — cleared when a new link is clicked or
   the user clicks anywhere outside an rcn-link. */
let _highlightedTocRow = null;

/* Scroll containerEl to the ToC row for corrId and highlight it persistently.
   If containerEl is independently scrollable (Research sub-panel) the scroll
   stays within it; otherwise falls back to page-level scrollIntoView. */
function scrollToTocCorr(corrId, containerEl) {
  if (!containerEl) return;
  const target = containerEl.querySelector('#' + CSS.escape('toc-corr-' + corrId));
  if (!target) return;
  if (containerEl.scrollHeight > containerEl.clientHeight + 1) {
    /* Contained scroll — Research Parameters sub-panel */
    const cRect = containerEl.getBoundingClientRect();
    const tRect = target.getBoundingClientRect();
    containerEl.scrollBy({ top: tRect.top - cRect.top - containerEl.clientHeight / 2 + tRect.height / 2,
                           behavior: 'smooth' });
  } else {
    /* Page-level scroll — standalone Parameters tab */
    target.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }
  /* Clear previous highlight, set new one */
  if (_highlightedTocRow) _highlightedTocRow.classList.remove('toc-row-highlight');
  _highlightedTocRow = target;
  target.classList.add('toc-row-highlight');
}

/* Clear the highlight when the user clicks anywhere other than an rcn-link. */
document.addEventListener('click', function (e) {
  if (!e.target.closest('a.rcn-link') && _highlightedTocRow) {
    _highlightedTocRow.classList.remove('toc-row-highlight');
    _highlightedTocRow = null;
  }
});

/* Research pane: rcn-link click → scroll within the Parameters sub-panel. */
document.getElementById('research-sets-content').addEventListener('click', function (e) {
  const link = e.target.closest('a.rcn-link');
  if (!link) return;
  e.preventDefault();
  scrollToTocCorr(link.dataset.corrId,
                  document.getElementById('research-parameters-view-content'));
});

/* Standalone Sets tab: rcn-link click → switch to Parameters tab then scroll. */
document.getElementById('sets-content').addEventListener('click', function (e) {
  const link = e.target.closest('a.rcn-link');
  if (!link) return;
  e.preventDefault();
  const corrId = link.dataset.corrId;
  activateTab('tab-parameters');
  scrollToTocCorr(corrId, document.getElementById('parameters-view-content'));
});

/* ══════════════════════════════════════════════════════════════════════════
   Research post-processing
   Strips the XSLT-generated section title from each sub-pane's content
   (it is already shown in the panel header bar) and, for Sets, extracts
   counts/jump-link wiring from the stats block the XSLT renders at the top.
   ══════════════════════════════════════════════════════════════════════════ */
function postProcessResearch(tab) {
  if (tab === 'parameters') {
    const content = document.getElementById('research-parameters-view-content');
    if (!content) return;
    /* Remove any file-label headings added by routes.py for multi-file projects
       (the collapsible sections are self-labelled; no top-level heading needed). */
    content.querySelectorAll('h5, h6').forEach(h => h.remove());

  } else if (tab === 'sets') {
    const content = document.getElementById('research-sets-content');
    if (!content) return;

    /* ── Extract counts (from data-count attrs) and wire panel jump buttons ── */
    const isoBtn   = content.querySelector('button[data-target="isolates"]');
    const failBtn  = content.querySelector('button[data-target="failures"]');
    const setsBtn  = content.querySelector('button[data-target="sets-top"]');
    const setsJump = document.getElementById('research-link-sets-top');
    const isoJump  = document.getElementById('research-link-isolates');
    const failJump = document.getElementById('research-link-failures');

    if (setsBtn && setsJump) {
      setsJump.textContent = setsBtn.dataset.count + ' sets';
      setsJump.style.display = '';
      setsJump.onclick = () => {
        const target = content.querySelector('[name="sets-top"]');
        if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
        const st = content.querySelector('.re-scroll-table');
        if (st) st.scrollTo({ top: 0, behavior: 'smooth' });
      };
    }
    if (isoBtn && isoJump) {
      isoJump.textContent = isoBtn.dataset.count + ' isolates';
      isoJump.style.display = '';
      isoJump.onclick = () => {
        const target = content.querySelector('[name="isolates"]');
        if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
      };
    }
    if (failBtn && failJump) {
      failJump.textContent = failBtn.dataset.count + ' failures';
      failJump.style.display = '';
      failJump.onclick = () => {
        const target = content.querySelector('[name="failures"]');
        if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
      };
    }

    /* ── Remove the XSLT-generated header block (panel has its own header) ──
       Tabular: h5 + toolbar are inside .row:first-child → remove that row.
       Paragraph: h5 followed directly by .tab-toolbar → remove both. */
    const firstRow = content.querySelector('.row');
    if (firstRow) {
      firstRow.remove();
    } else {
      const h5 = content.querySelector('h5');
      if (h5) {
        const next = h5.nextElementSibling;
        h5.remove();
        if (next && next.classList.contains('tab-toolbar')) next.remove();
      }
    }
  }
}

/* Wire up the .sets-nav-btn buttons in the standalone Sets tab.
   Each button carries data-target (named anchor) and data-count.
   Clicks scroll to the matching [name="..."] anchor within the container;
   for "sets-top" the re-scroll-table is also reset to its own top. */
function postProcessSets(containerEl) {
  containerEl.querySelectorAll('.sets-nav-btn').forEach(btn => {
    btn.addEventListener('click', function() {
      const targetName = this.dataset.target;
      const anchor = containerEl.querySelector('[name="' + targetName + '"]');
      if (anchor) anchor.scrollIntoView({ behavior: 'smooth', block: 'start' });
      if (targetName === 'sets-top') {
        const st = containerEl.querySelector('.re-scroll-table');
        if (st) st.scrollTo({ top: 0, behavior: 'smooth' });
      }
    });
  });
}

/* ══════════════════════════════════════════════════════════════════════════
   Log helpers
   ══════════════════════════════════════════════════════════════════════════ */
function appendLog(lines) {
  if (!lines.length) return;
  const el = document.getElementById('run-log');
  el.textContent += lines.join('\n') + '\n';
  el.scrollTop = el.scrollHeight;
}

function setRunStatusBadge(text, cls) {
  const badge = document.getElementById('run-status-badge');
  badge.textContent = text;
  badge.className = `badge ml-1 badge-${cls}`;
}

/* Re-execute <script> tags that were injected via innerHTML
   (browsers do not run scripts injected that way). */
function reExecuteScripts(container) {
  container.querySelectorAll('script').forEach(oldScript => {
    const s = document.createElement('script');
    s.textContent = oldScript.textContent;
    document.head.appendChild(s);
    document.head.removeChild(s);
  });
}

/* ══════════════════════════════════════════════════════════════════════════
   Run button  (event-delegated so newly-rebuilt rows also work)
   ══════════════════════════════════════════════════════════════════════════ */
document.getElementById('main-tab-content').addEventListener('click', function (e) {
  /* History-panel buttons — handled before run-btn so we can return early */
  const histBtn = e.target.closest('.hist-btn');
  if (histBtn) { toggleHistory(histBtn.dataset.project); return; }

  const loadBtn = e.target.closest('.hist-load-btn');
  if (loadBtn) { loadHistRun(loadBtn.dataset.runId, loadBtn.dataset.project); return; }

  const cmpBtn = e.target.closest('.hist-compare-btn');
  if (cmpBtn) { doCompare(cmpBtn.dataset.project); return; }

  const delBtn = e.target.closest('.hist-delete-btn');
  if (delBtn) { deleteRun(delBtn.dataset.runId, delBtn.dataset.project); return; }

  const btn = e.target.closest('.run-btn');
  if (!btn) return;

  const project           = btn.dataset.project;
  const recon             = document.getElementById(`sel-recon-${project}`).value    || null;
  const mel               = document.getElementById(`sel-mel-${project}`).value      || null;
  const fuzzy             = document.getElementById(`sel-fuzzy-${project}`).value    || null;
  const upstream          = document.getElementById(`inp-upstream-${project}`).value.trim() || null;

  currentProject = project;

  document.querySelectorAll('.run-btn').forEach(b => b.disabled = true);

  document.getElementById('nav-log').style.display = '';
  document.getElementById('run-log').textContent = '';
  logLinesShown = 0;
  setRunStatusBadge('running', 'running');
  activateTab('tab-log');

  fetch('/api/run', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ project, recon, mel, fuzzy, upstream }),
  })
  .then(r => r.json())
  .then(data => {
    if (data.error) {
      alert(`Server error: ${data.error}`);
      document.querySelectorAll('.run-btn').forEach(b => b.disabled = false);
      return;
    }
    currentRunId   = data.run_id;
    currentRunName = data.run_name;
    /* Build a compact but informative run badge from the selected parameters. */
    (function() {
      const parts = [`project ${project}`];
      if (data.recon)              parts.push(`ToC: ${data.recon}`);
      if (data.mel)                parts.push(`MEL: ${data.mel}`);
      if (data.fuzzy)              parts.push(`fuzzy: ${data.fuzzy}`);
      if (data.upstream)           parts.push(`↑ ${data.upstream}`);
      document.getElementById('run-badge').textContent = parts.join('  ·  ');
    })();

    ['tab-parameters-nav','tab-research-nav','tab-sets-nav','tab-stats-nav',
     'tab-lexicons-nav','tab-mel-nav','tab-fuzzy-nav','tab-coverage-nav']
      .forEach(id => setTabEnabled(id, false));

    document.getElementById('nav-mel').style.display      = 'none';
    document.getElementById('nav-fuzzy').style.display    = 'none';
    document.getElementById('nav-coverage').style.display = 'none';
    document.getElementById('nav-compare').style.display  = 'none';
    setTabEnabled('tab-compare-nav', false);
    document.getElementById('btn-run-again').disabled = true;

    startPolling();
  })
  .catch(err => {
    alert(`Failed to start run: ${err}`);
    document.querySelectorAll('.run-btn').forEach(b => b.disabled = false);
  });
});

/* ══════════════════════════════════════════════════════════════════════════
   Projects Refresh button — re-scans project directories and rebuilds rows
   ══════════════════════════════════════════════════════════════════════════ */
(function setupProjectsRefresh() {
  const btn = document.getElementById('btn-refresh-projects');
  if (!btn) return;

  // ── localStorage helpers (keyed by project name + field) ──────────────────
  const lsKey = (project, field) => `re:${project}:${field}`;
  const lsGet = (project, field) => localStorage.getItem(lsKey(project, field));
  const lsSet = (project, field, val) => {
    if (val) localStorage.setItem(lsKey(project, field), val);
    else      localStorage.removeItem(lsKey(project, field));
  };

  function makeSelect(id, tokens, optional, project, field) {
    const sel = document.createElement('select');
    sel.className = 'form-control form-control-sm';
    sel.id = id;
    if (!tokens || tokens.length === 0) {
      const opt = document.createElement('option');
      opt.value = '';
      opt.textContent = '— none found —';
      sel.appendChild(opt);
    } else {
      if (optional) {
        const opt = document.createElement('option');
        opt.value = '';
        opt.textContent = 'N/A';
        sel.appendChild(opt);
      }
      tokens.forEach(t => {
        const opt = document.createElement('option');
        opt.value = t;
        opt.textContent = t;
        sel.appendChild(opt);
      });
    }
    // Restore last-used value from localStorage (if still a valid option)
    if (project && field) {
      const saved = lsGet(project, field);
      if (saved && [...sel.options].some(o => o.value === saved)) sel.value = saved;
      sel.addEventListener('change', () => lsSet(project, field, sel.value));
    }
    return sel;
  }

  function rebuildProjectsTable(data) {
    const tbody = document.querySelector('#projects-view .projects-table tbody');
    if (!tbody) return;
    tbody.innerHTML = '';
    Object.entries(data).sort((a,b) => a[0].localeCompare(b[0])).forEach(([name, info]) => {
      const tr = document.createElement('tr');
      tr.id = `proj-row-${name}`;
      tr.dataset.projectPath = info.path;

      const tdName = document.createElement('td');
      tdName.className = 'project-name align-middle';
      tdName.textContent = name;
      tr.appendChild(tdName);

      const tdRecon = document.createElement('td');
      tdRecon.appendChild(makeSelect(`sel-recon-${name}`, info.recons, false, name, 'recon'));
      tr.appendChild(tdRecon);

      const tdMel = document.createElement('td');
      tdMel.appendChild(makeSelect(`sel-mel-${name}`, info.mels, true, name, 'mel'));
      tr.appendChild(tdMel);

        ? `<i class="fas fa-history"></i> <span class="hist-count">${histCount}</span>`
        : '<i class="fas fa-history"></i>';

      actWrap.appendChild(runBtn);
      actWrap.appendChild(histBtn);
      tdAction.appendChild(actWrap);
      tr.appendChild(tdAction);

      const histRow = document.createElement('tr');

      histRow.style.display = 'none';

      histTd.appendChild(histDiv);
      histRow.appendChild(histTd);
      tbody.appendChild(histRow);
    });
  }

  btn.addEventListener('click', () => {
    const origHtml = btn.innerHTML;
    btn.disabled = true;
    btn.innerHTML = `${spinnerHtml()}Refreshing…`;
    fetch('/api/projects')
      .then(r => r.json())
      .then(data => {
        rebuildProjectsTable(data);
        btn.disabled = false;
        btn.innerHTML = origHtml;
      })
      .catch(err => {
        alert(`Refresh failed: ${err}`);
        btn.disabled = false;
        btn.innerHTML = origHtml;
      });
  });
})();

/* ══════════════════════════════════════════════════════════════════════════
   Post-run tab wiring  (shared by live polling and historical load)
   data must have: has_mel, has_fuzzy, has_coverage
   ══════════════════════════════════════════════════════════════════════════ */
/* activateAfter: tab id to show on completion; defaults to 'tab-research' */
function handleRunDone(data, activateAfter) {
  setRunTabsVisible(true);
  const always = ['parameters', 'sets', 'stats'];
  always.forEach(t => {
    setTabEnabled(`tab-${t}-nav`, true);
    loadTabContent(t, modes[t] || 'paragraph');
  });
  setTabEnabled('tab-lexicons-nav', true);
  loadLexiconTabs();
  document.getElementById('btn-freq-parameters').style.display = '';
  document.getElementById('btn-edit-parameters').style.display = '';

  document.getElementById('nav-mel').style.display      = 'none';
  document.getElementById('nav-fuzzy').style.display    = 'none';
  document.getElementById('nav-coverage').style.display = 'none';
  ['tab-mel-nav','tab-fuzzy-nav','tab-coverage-nav']
    .forEach(id => setTabEnabled(id, false));

  if (data.has_mel) {
    document.getElementById('nav-mel').style.display = '';
    setTabEnabled('tab-mel-nav', true);
    loadTabContent('mel');
    document.getElementById('btn-edit-mel').style.display = '';
  }
  if (data.has_fuzzy) {
    document.getElementById('nav-fuzzy').style.display = '';
    setTabEnabled('tab-fuzzy-nav', true);
    loadTabContent('fuzzy');
    document.getElementById('btn-edit-fuzzy').style.display = '';
  }
  if (data.has_coverage) {
    document.getElementById('nav-coverage').style.display = '';
    setTabEnabled('tab-coverage-nav', true);
    loadTabContent('coverage');
  }
  /* Update run badge with Match Type / Supers now that we have them. */
  if (data.context_match_type != null) {
    const badge = document.getElementById('run-badge');
    let text = badge.textContent;
    text += `  ·  Match Type: ${data.context_match_type || '—'}`;
    text += `  ·  Supers: ${data.spec || '—'}`;
    badge.textContent = text;
  }

  /* ── Research pane wiring ── */
  setTabEnabled('tab-research-nav', true);
  document.getElementById('btn-freq-research-parameters').style.display = '';
  document.getElementById('btn-edit-research-parameters').style.display = '';

  /* ── Interactive pane wiring ── */
  setTabEnabled('tab-interactive-nav', true);
  interactiveLoadedForRunId    = null;   // force input-table rebuild on next visit
  _interactivePaneReadyPromise = null;
  document.getElementById('btn-run-interactive').disabled   = false;
  document.getElementById('btn-clear-interactive').disabled = false;

  /* Enable Run Again */
  document.getElementById('btn-run-again').disabled = false;

  loadResearchPane();
  activateTab(activateAfter || 'tab-research');
}

/* ══════════════════════════════════════════════════════════════════════════
   Polling
   ══════════════════════════════════════════════════════════════════════════ */
function startPolling() {
  if (pollTimer) clearInterval(pollTimer);
  pollTimer = setInterval(doPoll, 1500);
}

function doPoll() {
  if (!currentRunId) return;
  fetch(`/api/poll/${currentRunId}`)
    .then(r => r.json())
    .then(data => {
      appendLog(data.log.slice(logLinesShown));
      logLinesShown = data.log.length;

      if (data.status === 'running') return;

      clearInterval(pollTimer);
      document.querySelectorAll('.run-btn').forEach(b => b.disabled = false);

      if (data.status === 'error') {
        setRunStatusBadge('error', 'error');
        const el = document.getElementById('run-log');
        el.textContent += '\n─── ERROR ───\n' + (data.error || '');
        el.scrollTop = el.scrollHeight;
        document.getElementById('btn-run-again').disabled = false;
        runFromResearch = false;
        return;
      }

      /* ── Success ── */
      setRunStatusBadge('done', 'done');
      const _goToResearch = runFromResearch;
      runFromResearch = false;
      handleRunDone(data, _goToResearch ? 'tab-research' : null);
      if (_goToResearch) loadResearchPane();
      /* Increment History button count for this project, and refresh the
         history list if the panel is already open so the new run appears
         immediately without requiring the user to close and reopen it. */
      if (currentProject) {
        const btn = document.querySelector(`.hist-btn[data-project="${currentProject}"]`);
        const prev = btn ? (parseInt(btn.dataset.count, 10) || 0) : 0;
        setHistoryBtnCount(currentProject, prev + 1);
        const histRow = document.getElementById(`hist-row-${currentProject}`);
        if (histRow && histRow.style.display !== 'none') {
          fetch(`/api/history/${currentProject}`)
            .then(r => r.json())
            .then(d => renderHistoryTable(currentProject, d.runs || []))
            .catch(err => console.error('History refresh error:', err));
        }
      }
    })
    .catch(err => console.error('Poll error:', err));
}

/* ══════════════════════════════════════════════════════════════════════════
   Lexicons — per-language sub-tabs (lazy loaded on demand)
   ══════════════════════════════════════════════════════════════════════════ */
function loadLexiconTabs() {
  if (!currentRunId) return;
  const nav     = document.getElementById('lexicons-lang-tabs');
  const content = document.getElementById('lexicons-content');
  nav.innerHTML     = '';
  content.innerHTML = `<p class="text-muted">${spinnerHtml()} Loading languages…</p>`;

  fetch(`/api/lexicon_langs/${currentRunId}`)
    .then(r => r.json())
    .then(data => {
      const langs = data.languages || [];
      if (!langs.length) {
        content.innerHTML = '<p class="text-muted">No lexicons.</p>';
        return;
      }
      langs.forEach((lg, i) => {
        const li = document.createElement('li');
        li.className = 'nav-item';
        const a = document.createElement('a');
        a.className = 'nav-link' + (i === 0 ? ' active' : '');
        a.href = '#';
        a.dataset.lang = lg;
        a.textContent = lg;
        a.addEventListener('click', function (e) {
          e.preventDefault();
          nav.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
          this.classList.add('active');
          loadLexiconLang(lg);
        });
        li.appendChild(a);
        nav.appendChild(li);
      });
      loadLexiconLang(langs[0]);
    })
    .catch(e => {
      content.innerHTML = `<p class="text-danger">Error loading languages: ${e}</p>`;
    });
}

function loadLexiconLang(lang) {
  if (!currentRunId) return;
  const mode    = modes.lexicons || 'paragraph';
  const content = document.getElementById('lexicons-content');
  content.innerHTML = `<p class="text-muted">${spinnerHtml()} Loading…</p>`;
  fetch(`/api/tab/${currentRunId}/lexicons?mode=${mode}&lang=${encodeURIComponent(lang)}`)
    .then(r => r.text())
    .then(html => { content.innerHTML = html; })
    .catch(e  => { content.innerHTML = `<p class="text-danger">Error: ${e}</p>`; });
}

   Parameters Edit / Save / Cancel  (XSLT form approach)
   idPrefix: 'parameters' (original tab) or 'research-parameters' (Research)
   ══════════════════════════════════════════════════════════════════════════ */
function setupParamsEdit(idPrefix) {
  const p         = idPrefix || 'parameters';
  const viewEl    = document.getElementById(`${p}-view-content`);
  const btnEdit   = document.getElementById(`btn-edit-${p}`);
  const btnSave   = document.getElementById(`btn-save-${p}`);
  const btnCancel = document.getElementById(`btn-cancel-${p}`);
  if (!btnEdit) return;

  let savedViewHTML    = null;
  let currentReconFile = null;

  btnEdit.addEventListener('click', () => {
    if (!currentRunId) return;
    btnEdit.disabled = true;
    btnEdit.innerHTML = `${spinnerHtml()}Loading…`;
    fetch(`/api/tab/${currentRunId}/parameters?mode=edit`)
      .then(r => {
        if (!r.ok) throw new Error(`HTTP ${r.status}`);
        return r.text();
      })
      .then(html => {
        savedViewHTML = viewEl.innerHTML;
        viewEl.innerHTML = html;
        reExecuteScripts(viewEl);
        const wrapper = viewEl.querySelector('[data-recon-file]');
        currentReconFile = wrapper ? wrapper.dataset.reconFile : null;
        btnEdit.style.display   = 'none';
        btnSave.style.display   = '';
        btnCancel.style.display = '';
      })
      .catch(err => {
        alert(`Could not load edit form: ${err}`);
        btnEdit.disabled = false;
        btnEdit.innerHTML = '<i class="fas fa-edit"></i> Edit';
      });
  });

  btnCancel.addEventListener('click', () => {
    if (savedViewHTML !== null) viewEl.innerHTML = savedViewHTML;
    savedViewHTML = null;
    currentReconFile = null;
    btnEdit.innerHTML     = '<i class="fas fa-edit"></i> Edit';
    btnEdit.disabled      = false;
    btnEdit.style.display = '';
    btnSave.style.display   = 'none';
    btnCancel.style.display = 'none';
  });

  btnSave.addEventListener('click', () => {
    if (!currentRunId || !currentReconFile) return;

    const fields = {};
    viewEl.querySelectorAll('input[name]').forEach(inp => {
      fields[inp.name] = inp.value;
    });

    const dialects = [];
    viewEl.querySelectorAll('#corr-table thead th[data-dialect]').forEach(th => {
      dialects.push(th.getAttribute('data-dialect'));
    });

    btnSave.disabled  = true;
    btnSave.innerHTML = `${spinnerHtml()}Saving…`;
    fetch(`/api/save_toc/${currentRunId}`, {
      method:  'POST',
      headers: { 'Content-Type': 'application/json' },
      body:    JSON.stringify({ fields, dialects, file_path: currentReconFile }),
    })
    .then(r => r.json())
    .then(data => {
      if (data.error) {
        alert(`Save failed:\n${data.error}`);
        btnSave.disabled  = false;
        btnSave.innerHTML = '<i class="fas fa-save"></i> Save';
        return;
      }
      savedViewHTML = null;
      currentReconFile = null;
      btnEdit.innerHTML     = '<i class="fas fa-edit"></i> Edit';
      btnEdit.disabled      = false;
      btnEdit.style.display = '';
      btnSave.style.display   = 'none';
      btnSave.disabled        = false;
      btnSave.innerHTML       = '<i class="fas fa-save"></i> Save';
      btnCancel.style.display = 'none';
      if (idPrefix) {
        loadResearchContent('parameters', `${p}-view-content`);
      } else {
        loadTabContent('parameters', 'paragraph');
      }
    })
    .catch(err => {
      alert(`Save error: ${err}`);
      btnSave.disabled  = false;
      btnSave.innerHTML = '<i class="fas fa-save"></i> Save';
    });
  });
}

    fetch('/api/save_projects', {
      method:  'POST',
      headers: { 'Content-Type': 'application/json' },
      body:    JSON.stringify({ projects }),
    })
    .then(r => r.json())
    .then(data => {
      if (data.error) {
        let msg = `Save failed:\n${data.error}`;
        if (data.invalid && data.invalid.length) {
          msg += '\n\nBad paths:\n' + data.invalid.map(
            e => `  ${e.name}: "${e.path}" (resolved: ${e.resolved})`).join('\n');
        }
        alert(msg);
        btnSave.disabled  = false;
        btnSave.innerHTML = '<i class="fas fa-save"></i> Save';
        return;
      }
      window.location.reload();
    })
    .catch(err => {
      alert(`Save error: ${err}`);
      btnSave.disabled  = false;
      btnSave.innerHTML = '<i class="fas fa-save"></i> Save';
    });
  });
})();

/* ══════════════════════════════════════════════════════════════════════════
   Run History — toggle, render, load, compare
   ══════════════════════════════════════════════════════════════════════════ */

function setHistoryBtnCount(project, count) {
  const btn = document.querySelector(`.hist-btn[data-project="${project}"]`);
  if (!btn) return;
  if (count <= 0) {
    btn.style.display = 'none';
    const row = document.getElementById(`hist-row-${project}`);
    if (row) row.style.display = 'none';
  } else {
    btn.style.display = '';
    btn.dataset.count = count;
    const span = btn.querySelector('.hist-count');
    if (span) span.textContent = count;
    else btn.innerHTML = `<i class="fas fa-history"></i> <span class="hist-count">${count}</span>`;
  }
}

function deleteRun(runId, project) {
  if (!confirm('Delete this run and its output files? This cannot be undone.')) return;
  fetch('/api/delete_run', {
    method:  'POST',
    headers: { 'Content-Type': 'application/json' },
    body:    JSON.stringify({ run_id: runId }),
  })
  .then(r => r.json())
  .then(data => {
    if (data.error) { alert(`Delete failed: ${data.error}`); return; }
    setHistoryBtnCount(project, data.history_count);
    /* Re-render the history table with fresh data */
    fetch(`/api/history/${project}`)
      .then(r => r.json())
      .then(d => renderHistoryTable(project, d.runs || []));
  })
  .catch(err => alert(`Delete error: ${err}`));
}

function toggleHistory(project) {
  const histRow = document.getElementById(`hist-row-${project}`);
  if (!histRow) return;
  if (histRow.style.display !== 'none') {
    histRow.style.display = 'none';
    return;
  }
  histRow.style.display = '';
  fetch(`/api/history/${project}`)
    .then(r => r.json())
    .then(data => renderHistoryTable(project, data.runs || []))
    .catch(err => {
      const c = document.getElementById(`hist-content-${project}`);
      if (c) c.innerHTML = `<p class="text-danger">Error: ${err}</p>`;
    });
}

function renderHistoryTable(project, runs) {
  const container = document.getElementById(`hist-content-${project}`);
  if (!container) return;
  if (!runs.length) {
    container.innerHTML = '<p class="text-muted mb-1">No past runs for this project.</p>';
    return;
  }
  let html = `<table class="table table-sm table-hover table-bordered mb-1"
                     style="font-size:.82rem">
    <thead class="thead-light"><tr>
      <th style="width:1%"></th>
      <th>Timestamp</th><th>Recon</th><th>MEL</th><th>Fuzzy</th>
      <th>Sets</th><th>Isolates</th><th>Failures</th><th>Cov</th><th>Match Type</th><th>Supers</th><th></th>
    </tr></thead><tbody>`;
  runs.forEach(run => {
    const ts  = (run.run_name || '').replace(
      /(\d{4})(\d{2})(\d{2})-(\d{2})(\d{2})(\d{2})/, '$1-$2-$3 $4:$5');
    const p   = run.params || {};
    const cov = run.has_coverage ? '&#10003;' : '';
    html += `<tr>
      <td><input type="checkbox" class="hist-check"
                 data-run-id="${run.run_id}"></td>
      <td style="white-space:nowrap">${ts}</td>
      <td>${basename(p.recon  || '') || '—'}</td>
      <td>${basename(p.mel    || '') || '—'}</td>
      <td>${basename(p.fuzzy  || '') || '—'}</td>
      <td>${run.sets      ?? '?'}</td>
      <td>${run.isolates  ?? '?'}</td>
      <td>${run.failures  ?? '?'}</td>
      <td>${cov}</td>
      <td>${p.context_match_type || '—'}</td>
      <td>${p.spec || '—'}</td>
      <td style="white-space:nowrap">
        <button class="btn btn-outline-primary hist-load-btn py-0 px-1"
                data-run-id="${run.run_id}" data-project="${project}"
                style="font-size:.8rem;line-height:1.4">Load</button>
        <button class="btn btn-outline-danger hist-delete-btn py-0 px-1 ml-1"
                data-run-id="${run.run_id}" data-project="${project}"
                title="Delete run and output files"
                style="font-size:.8rem;line-height:1.4">
          <i class="fas fa-trash-alt"></i>
        </button>
      </td>
    </tr>`;
  });
  html += `</tbody></table>
    <button class="btn btn-sm btn-outline-secondary hist-compare-btn"
            id="hist-compare-btn-${project}"
            data-project="${project}" disabled>
      Compare selected runs
    </button>`;
  container.innerHTML = html;
  container.querySelectorAll('.hist-check').forEach(cb => {
    cb.addEventListener('change', () => updateCompareBtn(project));
  });
}

function updateCompareBtn(project) {
  const container = document.getElementById(`hist-content-${project}`);
  if (!container) return;
  const n   = container.querySelectorAll('.hist-check:checked').length;
  const btn = document.getElementById(`hist-compare-btn-${project}`);
  if (btn) btn.disabled = (n !== 2);
}

function loadHistRun(runId, project) {
  fetch('/api/load_run', {
    method:  'POST',
    headers: { 'Content-Type': 'application/json' },
    body:    JSON.stringify({ run_id: runId }),
  })
  .then(r => r.json())
  .then(data => {
    if (data.error) { alert(`Load failed: ${data.error}`); return; }
    currentRunId   = data.run_id;
    currentRunName = data.run_name;
    currentProject = data.project;
    /* Update navbar badge */
    const p = data.params || {};
    const parts = [`project ${data.project}`];
    if (p.recon)              parts.push(`ToC: ${basename(p.recon)}`);
    if (p.mel)                parts.push(`MEL: ${basename(p.mel)}`);
    if (p.fuzzy)              parts.push(`fuzzy: ${basename(p.fuzzy)}`);
    if (p.upstream)           parts.push(`↑ ${p.upstream}`);
    if (p.context_match_type) parts.push(`Match Type: ${p.context_match_type}`);
    if (p.spec)               parts.push(`Supers: ${p.spec}`);
    document.getElementById('run-badge').textContent = parts.join('  ·  ');
    /* Populate Log tab from persisted log file */
    const logEl = document.getElementById('run-log');
    logEl.textContent = (data.log && data.log.length)
      ? data.log.join('\n') : '(no log available)';
    logLinesShown = (data.log || []).length;
    setRunStatusBadge('done', 'done');
    document.getElementById('nav-log').style.display = '';
    /* Hide Compare pane — it belongs to the previous run/project */
    document.getElementById('nav-compare').style.display = 'none';
    setTabEnabled('tab-compare-nav', false);
    /* Reset disabled tabs before wiring */
    ['tab-parameters-nav','tab-research-nav','tab-sets-nav','tab-stats-nav',
     'tab-lexicons-nav','tab-mel-nav','tab-fuzzy-nav','tab-coverage-nav']
      .forEach(id => setTabEnabled(id, false));
    handleRunDone(data);
  })
  .catch(err => alert(`Load error: ${err}`));
}

function doCompare(project) {
  const container = document.getElementById(`hist-content-${project}`);
  if (!container) return;
  const checked = Array.from(container.querySelectorAll('.hist-check:checked'));
  if (checked.length !== 2) return;
  const [idA, idB] = checked.map(cb => cb.dataset.runId);

  document.getElementById('nav-compare').style.display = '';
  setTabEnabled('tab-compare-nav', true);
  const cmpEl = document.getElementById('compare-content');
  cmpEl.innerHTML = `<p>${spinnerHtml()} Comparing…</p>`;
  activateTab('tab-compare');

  fetch('/api/compare_runs', {
    method:  'POST',
    headers: { 'Content-Type': 'application/json' },
    body:    JSON.stringify({ run_id_a: idA, run_id_b: idB }),
  })
  .then(r => r.text())
  .then(html => { cmpEl.innerHTML = html; })
  .catch(err => { cmpEl.innerHTML =
    `<p class="text-danger">Compare error: ${err}</p>`; });
}

function closeCompare() {
  document.getElementById('nav-compare').style.display = 'none';
  setTabEnabled('tab-compare-nav', false);
  activateTab('tab-projects');
}

/* ══════════════════════════════════════════════════════════════════════════
   Wire up nav-link click handlers (custom switcher — no Bootstrap tab plugin)
   ══════════════════════════════════════════════════════════════════════════ */
document.querySelectorAll('#main-tabs .nav-link[data-re-tab]').forEach(link => {
  link.addEventListener('click', function (e) {
    e.preventDefault();
    if (this.classList.contains('disabled')) return;
    const targetId = this.getAttribute('href').substring(1);
    activateTab(targetId);
    const tabName = targetId.replace(/^tab-/, '');
    if (tabName === 'projects') {
      /* Return to Projects: hide result tabs only when no run is loaded */
      if (!currentRunId) setRunTabsVisible(false);
      return;
    }
    /* Any non-Projects tab: ensure result tabs are visible */
    setRunTabsVisible(true);
    if (tabName === 'log' || tabName === 'compare' || !currentRunId) return;
    if (tabName === 'lexicons') return;  // sub-tabs manage their own content
    if (tabName === 'research')     { loadResearchPane();     return; }
    if (tabName === 'interactive')  { loadInteractivePane();  return; }
    const saveBtn = document.getElementById(`btn-save-${tabName}`);
    if (saveBtn && saveBtn.style.display !== 'none') return;
    loadTabContent(tabName, modes[tabName] || 'paragraph');
  });
});

/* ══════════════════════════════════════════════════════════════════════════
   Run Again button — re-submits current project with its current parameters
   ══════════════════════════════════════════════════════════════════════════ */
(function setupRunAgain() {
  const btn = document.getElementById('btn-run-again');
  if (!btn) return;

  btn.addEventListener('click', () => {
    if (!currentProject || !currentRunId) return;

    const reconSel    = document.getElementById(`sel-recon-${currentProject}`);
    const melSel      = document.getElementById(`sel-mel-${currentProject}`);
    const fuzzySel    = document.getElementById(`sel-fuzzy-${currentProject}`);
    const upstreamInp = document.getElementById(`inp-upstream-${currentProject}`);
    if (!reconSel) {
      alert('Project row not found. Go to the Projects tab to re-run.');
      return;
    }

    const recon    = reconSel.value                          || null;
    const mel      = melSel      ? melSel.value      || null : null;
    const fuzzy    = fuzzySel    ? fuzzySel.value    || null : null;
    const upstream = upstreamInp ? upstreamInp.value.trim() || null : null;

    runFromResearch = true;
    btn.disabled = true;
    document.querySelectorAll('.run-btn').forEach(b => b.disabled = true);

    ['tab-parameters-nav','tab-research-nav','tab-sets-nav','tab-stats-nav',
     'tab-lexicons-nav','tab-mel-nav','tab-fuzzy-nav','tab-coverage-nav']
      .forEach(id => setTabEnabled(id, false));
    document.getElementById('nav-mel').style.display      = 'none';
    document.getElementById('nav-fuzzy').style.display    = 'none';
    document.getElementById('nav-coverage').style.display = 'none';
    document.getElementById('nav-compare').style.display  = 'none';
    setTabEnabled('tab-compare-nav', false);

    document.getElementById('nav-log').style.display = '';
    document.getElementById('run-log').textContent   = '';
    logLinesShown = 0;
    setRunStatusBadge('running', 'running');
    activateTab('tab-log');

    fetch('/api/run', {
      method:  'POST',
      headers: { 'Content-Type': 'application/json' },
      body:    JSON.stringify({ project: currentProject, recon, mel, fuzzy, upstream }),
    })
    .then(r => r.json())
    .then(data => {
      if (data.error) {
        alert(`Server error: ${data.error}`);
        btn.disabled    = false;
        runFromResearch = false;
        document.querySelectorAll('.run-btn').forEach(b => b.disabled = false);
        return;
      }
      currentRunId   = data.run_id;
      currentRunName = data.run_name;
      const parts = [`project ${currentProject}`];
      if (data.recon)    parts.push(`ToC: ${data.recon}`);
      if (data.mel)      parts.push(`MEL: ${data.mel}`);
      if (data.fuzzy)    parts.push(`fuzzy: ${data.fuzzy}`);
      if (data.upstream) parts.push(`↑ ${data.upstream}`);
      document.getElementById('run-badge').textContent = parts.join('  ·  ');
      startPolling();
    })
    .catch(err => {
      alert(`Failed to start run: ${err}`);
      btn.disabled    = false;
      runFromResearch = false;
      document.querySelectorAll('.run-btn').forEach(b => b.disabled = false);
    });
  });
})();

/* ══════════════════════════════════════════════════════════════════════════
   Interactive pane — load, build input table, Run / Clear buttons
   ══════════════════════════════════════════════════════════════════════════ */

/* Populate the Input sub-pane when the Interactive tab is first opened for
   a given run.  Returns a Promise that resolves once the table is ready.
   Calling again for the same run returns a resolved Promise immediately.
   While a fetch is in-flight, subsequent calls reuse the same Promise. */
function loadInteractivePane() {
  if (!currentRunId) return Promise.resolve();
  if (interactiveLoadedForRunId === currentRunId) return Promise.resolve();
  if (_interactivePaneReadyPromise) return _interactivePaneReadyPromise;

  interactiveLoadedForRunId = currentRunId;
  const inputEl = document.getElementById('interactive-input-content');
  inputEl.innerHTML = `<p class="text-muted">${spinnerHtml()} Loading languages…</p>`;

  _interactivePaneReadyPromise = fetch(`/api/interactive_langs/${currentRunId}`)
    .then(r => r.json())
    .then(data => {
      if (data.error) {
        inputEl.innerHTML = `<p class="text-danger">${data.error}</p>`;
        interactiveLoadedForRunId = null;
        throw new Error(data.error);
      }
      buildInteractiveInputTable(data.languages);
    })
    .catch(err => {
      if (_interactivePaneReadyPromise) {   // not already reset by a new run
        inputEl.innerHTML = `<p class="text-danger">Error loading languages: ${err}</p>`;
        interactiveLoadedForRunId = null;
      }
      throw err;
    })
    .finally(() => { _interactivePaneReadyPromise = null; });

  return _interactivePaneReadyPromise;
}

function buildInteractiveInputTable(languages) {
  const inputEl = document.getElementById('interactive-input-content');
  if (!languages || !languages.length) {
    inputEl.innerHTML = '<p class="text-muted">No attested languages found.</p>';
    return;
  }

  const proj = currentProject || '';

  let html = '<table class="table table-sm table-bordered mb-0" id="interactive-input-table">'
           + '<thead class="thead-light"><tr>'
           + '<th>Language</th><th>Reflex</th><th>Gloss</th>'
           + '</tr></thead><tbody>';

  languages.forEach(lang => {
    const lsRef = localStorage.getItem(`re:int:${proj}:${lang}:reflex`) || '';
    const lsGls = localStorage.getItem(`re:int:${proj}:${lang}:gloss`)  || '';
    function escAttr(s) {
      return s.replace(/&/g,'&amp;').replace(/"/g,'&quot;')
              .replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }
    html += `<tr>
      <td class="lang-cell align-middle">${escAttr(lang)}</td>
      <td><input type="text" class="form-control form-control-sm interactive-reflex"
                 data-lang="${escAttr(lang)}" value="${escAttr(lsRef)}" autocomplete="off"></td>
      <td><input type="text" class="form-control form-control-sm interactive-gloss"
                 data-lang="${escAttr(lang)}" value="${escAttr(lsGls)}" autocomplete="off"></td>
    </tr>`;
  });

  html += '</tbody></table>';
  inputEl.innerHTML = html;

  /* Persist each keystroke to localStorage */
  inputEl.querySelectorAll('.interactive-reflex, .interactive-gloss').forEach(inp => {
    inp.addEventListener('input', () => {
      const lang  = inp.dataset.lang;
      const field = inp.classList.contains('interactive-reflex') ? 'reflex' : 'gloss';
      const key   = `re:int:${proj}:${lang}:${field}`;
      if (inp.value.trim()) localStorage.setItem(key, inp.value);
      else                  localStorage.removeItem(key);
    });
  });
}

/* Run button */
document.getElementById('btn-run-interactive').addEventListener('click', function () {
  const table = document.getElementById('interactive-input-table');
  if (!table || !currentRunId) return;

  const forms = [];
  table.querySelectorAll('tbody tr').forEach(tr => {
    const reflexInp = tr.querySelector('.interactive-reflex');
    const glossInp  = tr.querySelector('.interactive-gloss');
    if (!reflexInp) return;
    const reflex = reflexInp.value.trim();
    if (!reflex) return;
    forms.push({
      language: reflexInp.dataset.lang,
      reflex,
      gloss: glossInp ? glossInp.value.trim() : '',
    });
  });

  if (!forms.length) {
    alert('Please enter at least one reflex before running.');
    return;
  }

  const processEl = document.getElementById('interactive-process-content');
  const resultsEl = document.getElementById('interactive-results-content');
  processEl.innerHTML = `<p class="text-muted">${spinnerHtml()} Running…</p>`;
  resultsEl.innerHTML = `<p class="text-muted">${spinnerHtml()} Running…</p>`;
  this.disabled = true;

  fetch('/api/interactive_run', {
    method:  'POST',
    headers: { 'Content-Type': 'application/json' },
    body:    JSON.stringify({ run_id: currentRunId, forms }),
  })
  .then(r => r.json())
  .then(data => {
    if (data.error) {
      processEl.innerHTML = `<p class="text-danger">Error: ${data.error}</p>`;
      resultsEl.innerHTML = '<p class="text-muted">No results.</p>';
      return;
    }
    processEl.innerHTML = data.process_html || '<p class="text-muted">No process output.</p>';
    resultsEl.innerHTML = data.sets_html    || '<p class="text-muted">No sets produced.</p>';
  })
  .catch(err => {
    processEl.innerHTML = `<p class="text-danger">Request failed: ${err}</p>`;
    resultsEl.innerHTML = '';
  })
  .finally(() => { this.disabled = false; });
});

/* Clear button */
document.getElementById('btn-clear-interactive').addEventListener('click', function () {
  const proj = currentProject || '';
  document.querySelectorAll('#interactive-input-table input').forEach(inp => {
    inp.value = '';
    const lang  = inp.dataset.lang;
    const field = inp.classList.contains('interactive-reflex') ? 'reflex' : 'gloss';
    localStorage.removeItem(`re:int:${proj}:${lang}:${field}`);
  });
  document.getElementById('interactive-process-content').innerHTML =
    '<p class="text-muted">Enter forms and click Run.</p>';
  document.getElementById('interactive-results-content').innerHTML =
    '<p class="text-muted">Results will appear here.</p>';
});

/* ══════════════════════════════════════════════════════════════════════════
   Set → Interactive link
   Clicking a .set-interactive-link (rendered by sets2html/sets2tabular XSLT)
   fetches the set's forms, populates the Interactive input table, then runs.
   Works from both the Sets tab and the Research pane's Sets panel.
   ══════════════════════════════════════════════════════════════════════════ */

/* Fill the Interactive input table with the given forms array
   [{language, reflex, gloss}, ...], clearing any previous values first. */
function populateInteractiveInputs(forms) {
  const table = document.getElementById('interactive-input-table');
  if (!table) return;
  const proj = currentProject || '';

  /* Clear all inputs and remove their localStorage entries */
  table.querySelectorAll('.interactive-reflex, .interactive-gloss').forEach(inp => {
    inp.value = '';
    const lang  = inp.dataset.lang;
    const field = inp.classList.contains('interactive-reflex') ? 'reflex' : 'gloss';
    localStorage.removeItem(`re:int:${proj}:${lang}:${field}`);
  });

  /* Fill in provided forms */
  forms.forEach(({language, reflex, gloss}) => {
    const esc  = CSS.escape(language);
    const rInp = table.querySelector(`.interactive-reflex[data-lang="${esc}"]`);
    const gInp = table.querySelector(`.interactive-gloss[data-lang="${esc}"]`);
    if (rInp && reflex) {
      rInp.value = reflex;
      localStorage.setItem(`re:int:${proj}:${language}:reflex`, reflex);
    }
    if (gInp && gloss) {
      gInp.value = gloss;
      localStorage.setItem(`re:int:${proj}:${language}:gloss`, gloss);
    }
  });
}

/* Shared: ensure the Interactive input table is ready, fill it, switch tab, run. */
function _runInteractiveWithForms(forms) {
  return loadInteractivePane().then(() => {
    populateInteractiveInputs(forms);
    const navLink = document.getElementById('tab-interactive-nav');
    if (navLink && !navLink.classList.contains('disabled')) navLink.click();
    const runBtn = document.getElementById('btn-run-interactive');
    if (runBtn && !runBtn.disabled) runBtn.click();
  });
}

/* Event delegation: handle clicks on .set-interactive-link (set IDs) and
   .rfx-interactive-link (isolate/failure row IDs) in the Sets tab and the
   Research pane's sets panel. */
['sets-content', 'research-sets-content'].forEach(containerId => {
  const el = document.getElementById(containerId);
  if (!el) return;
  el.addEventListener('click', function (e) {
    if (!currentRunId) return;

    /* ── Set ID: fetch all forms in the set from the server ── */
    const setLink = e.target.closest('.set-interactive-link');
    if (setLink) {
      const setNum = setLink.dataset.setNum;
      if (!setNum) return;
      e.preventDefault();
      fetch(`/api/run/${currentRunId}/set_forms?num=${encodeURIComponent(setNum)}`)
        .then(r => r.json())
        .then(data => {
          if (data.error) { alert(`Could not load set ${setNum}: ${data.error}`); return; }
          return _runInteractiveWithForms(data.forms);
        })
        .catch(err => alert(`Error loading set ${setNum}: ${err}`));
      return;
    }

    /* ── Isolate / Failure ID: form data is embedded inline ── */
    const rfxLink = e.target.closest('.rfx-interactive-link');
    if (rfxLink) {
      const language = rfxLink.dataset.lang;
      const reflex   = rfxLink.dataset.reflex;
      const gloss    = rfxLink.dataset.gloss || '';
      if (!language || !reflex) return;
      e.preventDefault();
      _runInteractiveWithForms([{language, reflex, gloss}])
        .catch(err => alert(`Error: ${err}`));
    }
  });
});

/* ══════════════════════════════════════════════════════════════════════════
   Back-to-top button — appears after scrolling down, hidden on Projects tab
   ══════════════════════════════════════════════════════════════════════════ */
(function () {
  const btn = document.getElementById('btn-back-to-top');
  if (!btn) return;

  function updateTopBtn() {
    const scrolled    = window.scrollY > 150;
    const onProjects  = document.getElementById('tab-projects')
                          .classList.contains('active');
    btn.classList.toggle('visible', scrolled && !onProjects);
  }

  window.addEventListener('scroll', updateTopBtn, { passive: true });

  /* Patch activateTab so switching tabs also re-evaluates visibility. */
  const _origActivateTab = activateTab;
  activateTab = function (targetId) {
    _origActivateTab(targetId);
    updateTopBtn();
  };
})();
</script>
