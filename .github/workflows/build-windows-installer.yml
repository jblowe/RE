name: Build Windows Installer

# Triggers:
#   - Manually from the Actions tab (Run workflow button) — use this for testing
#   - Automatically on every version tag push (e.g. git tag v1.2 && git push --tags)
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
    paths:
      - 'installer/**'
      - 'src/**'
      - 'REwww/**'
      - 'styles/**'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write   # needed to upload assets to GitHub Releases

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history + tags, so `git describe` can count commits since the last tag

      - name: Stamp VERSION from git
        # Installed copies have no .git, so src/version.py falls back to this file.
        # Tag build -> "2.0.1-rc1"; untagged build -> "2.0.1-rc1+73.g7f49fd6".
        run: |
          $v = (python src\version.py).Trim()
          if (-not $v -or $v -eq "unknown") { throw "could not determine version" }
          [System.IO.File]::WriteAllText("$PWD\VERSION", "$v`n")
          Write-Host "VERSION = $v"
        shell: pwsh

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress
        shell: pwsh

      - name: Download MSYS2 installer
        # Pin to a specific release for reproducible builds.
        # The release tag uses dashes (YYYY-MM-DD); the filename does not.
        # Update $fileVer and $tagVer together when bumping the MSYS2 version.
        run: |
          $fileVer = "20241208"
          $tagVer  = "2024-12-08"
          $url = "https://github.com/msys2/msys2-installer/releases/download/$tagVer/msys2-x86_64-$fileVer.exe"
          Write-Host "Downloading MSYS2 $fileVer..."
          Invoke-WebRequest -Uri $url -OutFile "installer\msys2-installer.exe" -UseBasicParsing
        shell: pwsh

      - name: Create output directory
        run: New-Item -ItemType Directory -Force installer\dist
        shell: pwsh

      - name: Compile installer
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          & $iscc installer\RE-installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        shell: pwsh

      - name: Upload installer as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: RE2
          path: installer/dist/RE-setup.exe
          retention-days: 90

      # Attach to a versioned GitHub Release when triggered by a tag push
      - name: Attach installer to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: installer/dist/RE-setup.exe

      # On manual dispatch: create/overwrite a rolling "latest" pre-release
      - name: Update latest pre-release
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build (pre-release)
          prerelease: true
          make_latest: false
          body: |
            Automatically updated by a manual workflow run on ${{ github.sha }}.
            Not a versioned release — use a `v*` tag for a stable release.
          files: installer/dist/RE-setup.exe
